name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: npm install
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # Loudly fails if the client bundle lost its __ModuleLoader__ banner.
      - run: node scripts/preflight.mjs
